openapi: 3.0.3
info:
  title: Duel Masters Game Platform API
  version: 0.1.0
  description: >-
    The HTTP API of the Go server. The Go handler interfaces and the TypeScript client are generated
    from this file; edit it, then regenerate both.


    Requests that change something (POST, PUT, PATCH, DELETE) must be sent as JSON with
    `Content-Type: application/json`, which browsers cannot do across sites without permission;
    other content types are refused with 415. Logged-in requests carry the session cookie set by
    sign-up and login.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: /api
tags:
  - name: system
    description: The server itself.
  - name: auth
    description: Accounts, logging in and out, and passwords.
  - name: cards
    description: >-
      The card catalogue: every card in the card database, with its printings and pictures, and
      whether the rules engine can play it. Reprints are one card with several printings.
  - name: chat
    description: The lobby chat, which everyone can read and players can write in.
  - name: lobby
    description: >-
      Open games waiting for an opponent, listed or reached by invite link, quick match, and
      rematches. A player hosts, waits in quick match, plays or decides on a rematch, one at a time.
  - name: games
    description: >-
      Running games: their players play, and other players watch listed games that allow it, over
      a websocket the duel board opens.
  - name: players
    description: >-
      Ratings, rankings, profiles and match history, for players. Each player has an Elo rating,
      starting at 1000, shown as a rank; a won game that counts moves both players' ratings.
  - name: formats
    description: >-
      The formats games are played in: the sets each allows and the cards it bans or limits, on
      top of the game's own rules (exactly 40 cards, at most 4 copies of a card).
  - name: decks
    description: >-
      The logged-in player's decks. They are private: another player's deck is answered as not
      found. A deck may be saved unfinished, and says for every format whether it is legal and why
      not. Starter decks are ready-made decks every player may play, or copy into their own decks to
      change; the first is every player's default.
  - name: admin
    description: >-
      The admin panel, for admins only. Every change is recorded in the admin log. No admin can
      act on their own account here.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the server and its database are working
      tags: [system]
      responses:
        "200":
          description: The server and its database are working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is not answering.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/signup:
    post:
      operationId: signUp
      summary: Create an account and log it in
      description: The first account ever created becomes the admin.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The account was created and is logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "403":
          description: An admin has closed sign-ups (code "signups_closed").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The username is taken, in any case (code "username_taken").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: logIn
      summary: Log in
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          description: >-
            Wrong username or password (code "invalid_credentials"). The answer does not say which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            The password is right but the account is banned (code "banned"), with the reason and,
            for a timed ban, when it ends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/logout:
    post:
      operationId: logOut
      summary: Log out
      description: Ends this session. Logging out without a session is not an error.
      tags: [auth]
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearSessionCookie"
  /auth/me:
    get:
      operationId: getCurrentAccount
      summary: The account that is logged in
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The logged-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /auth/password:
    post:
      operationId: changePassword
      summary: Change the password
      description: >-
        Needs the current password. Every other session of the account ends; this one stays logged
        in.
      tags: [auth]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: The password was changed.
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The current password is wrong (code "wrong_password").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /cards:
    get:
      operationId: searchCards
      summary: Search the card catalogue
      description: >-
        Cards in name order. Every filter narrows the search; a list filter, given once per value,
        matches cards having any of its values.
      tags: [cards]
      parameters:
        - name: q
          in: query
          description: Text looked for in the name and rules text, ignoring case and accents.
          schema:
            type: string
            maxLength: 100
        - name: civilization
          in: query
          schema:
            type: array
            items:
              type: string
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
        - name: race
          in: query
          schema:
            type: array
            items:
              type: string
        - name: keyword
          in: query
          schema:
            type: array
            items:
              type: string
        - name: set
          in: query
          description: Matches cards with a printing in the set.
          schema:
            type: array
            items:
              type: string
        - name: minCost
          in: query
          schema:
            type: integer
            minimum: 0
        - name: maxCost
          in: query
          schema:
            type: integer
            minimum: 0
        - name: playable
          in: query
          description: Only cards the rules engine can play.
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 60
      responses:
        "200":
          description: One page of matching cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPage"
        "400":
          $ref: "#/components/responses/InvalidInput"
  /cards/filters:
    get:
      operationId: getCardFilters
      summary: The values the card search can filter by
      tags: [cards]
      responses:
        "200":
          description: The values, from the cards in the catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardFilters"
  /cards/{cardId}:
    get:
      operationId: getCard
      summary: One card, with every printing
      tags: [cards]
      parameters:
        - name: cardId
          in: path
          required: true
          description: The card's id, its first printing's id in the card database.
          schema:
            type: string
      responses:
        "200":
          description: The card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          $ref: "#/components/responses/NotFound"
  /cards/images/{key}:
    get:
      operationId: getCardImage
      summary: A card's picture
      description: >-
        By printing id, or by the rules engine's card id, which the duel board uses and which gives
        the card's first printing. Browsers may keep pictures for a day and check them again with
        If-Modified-Since.
      tags: [cards]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The picture.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: The browser's copy is still current.
        "404":
          $ref: "#/components/responses/NotFound"
  /cards/sets/{setCode}/icon:
    get:
      operationId: getCardSetIcon
      summary: A set's icon
      tags: [cards]
      parameters:
        - name: setCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The icon.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: The browser's copy is still current.
        "404":
          $ref: "#/components/responses/NotFound"
  /realtime:
    get:
      operationId: openRealtime
      summary: Open the live connection
      description: >-
        A websocket, opened by every tab of the site, logged in or not, which the server uses to push
        lobby updates, chat and notices such as a game starting. The messages are described by the
        RealtimeMessage schema. The browser sends nothing but answers to pings. Only the site's own
        pages may open it (their Origin must be one of SITE_ORIGINS).
      tags: [system]
      responses:
        "101":
          description: Switching to the websocket.
        "400":
          description: Not a websocket request.
        "403":
          description: Opened from a page that is not the site's.
  /chat:
    get:
      operationId: getChat
      summary: The latest lobby chat messages, oldest first
      description: >-
        Everyone can read the chat, visitors included. New messages arrive on the live connection
        as RealtimeChatMessage.
      tags: [chat]
      responses:
        "200":
          description: The latest 100 messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: postChatMessage
      summary: Post to the lobby chat
      description: Line breaks become spaces; at most 5 messages per 10 seconds.
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatPost"
      responses:
        "201":
          description: The message, as everyone sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >-
            An admin has muted the player (code "muted"), with when it ends for a timed mute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooFast"
  /stats:
    get:
      operationId: getSiteStats
      summary: How many players are online and games running
      description: For everyone, visitors included. Updates arrive on the live connection as RealtimeSiteStats.
      tags: [system]
      responses:
        "200":
          description: The numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"
  /lobby:
    get:
      operationId: getLobby
      summary: The lobby as players see it
      description: Updates arrive on the live connection as RealtimeLobby.
      tags: [lobby]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The lobby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /lobby/games:
    post:
      operationId: openGame
      summary: Open a game for an opponent to join
      description: >-
        With one of the player's decks, legal in the format. A game nobody joins within 10 minutes
        closes, and so does a game whose host leaves the site.
      tags: [lobby]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenGameInput"
      responses:
        "201":
          description: The game is open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenGame"
        "400":
          $ref: "#/components/responses/InvalidDeckOrInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GamesPaused"
        "409":
          $ref: "#/components/responses/Busy"
  /lobby/games/{openGameId}:
    parameters:
      - name: openGameId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOpenGame
      summary: An open game, listed or not, as its invite link shows it
      tags: [lobby]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The open game.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenGame"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: cancelOpenGame
      summary: Cancel an open game; only its host may
      tags: [lobby]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The game is closed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Only the host can cancel the game (code "not_host").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /lobby/games/{openGameId}/join:
    post:
      operationId: joinOpenGame
      summary: Join an open game, which starts it
      description: Both players are then told on the live connection (RealtimeGameStarted) to go to the game.
      tags: [lobby]
      security:
        - sessionCookie: []
      parameters:
        - name: openGameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGameInput"
      responses:
        "201":
          description: The game started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStarted"
        "400":
          $ref: "#/components/responses/InvalidDeckOrInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GamesPaused"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The player is busy (code "busy"), this is their own game (code "own_game"), or the
            host's deck no longer keeps to the format (code "host_deck_not_legal"), which closes the
            game.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /quick-match:
    get:
      operationId: getQuickMatch
      summary: Quick match as the player sees it
      tags: [lobby]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: How many wait in each format, and whether this player waits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickMatchStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: enterQuickMatch
      summary: Wait for a quick match
      description: >-
        With one of the player's decks, legal in the format. A player already waiting in the format
        is paired at once and the game starts; otherwise the player waits, and is told on the live
        connection (RealtimeGameStarted) once paired.
      tags: [lobby]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickMatchInput"
      responses:
        "200":
          description: Paired, with the game, or waiting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickMatchEntered"
        "400":
          $ref: "#/components/responses/InvalidDeckOrInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GamesPaused"
        "409":
          $ref: "#/components/responses/Busy"
    delete:
      operationId: leaveQuickMatch
      summary: Stop waiting for a quick match
      description: Not waiting is not an error.
      tags: [lobby]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: No longer waiting.
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /computer-opponents:
    get:
      operationId: listComputerOpponents
      summary: The computer opponents a player can practise against
      tags: [computer]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The opponents, in order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComputerOpponent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /computer-opponents/{opponentId}/games:
    post:
      operationId: playComputerOpponent
      summary: Start a game against a computer opponent
      description: >-
        The game is not listed and cannot be watched. It is kept in the player's match history but
        never changes ratings. The answer gives the game to go to; no live message follows.
      tags: [computer]
      security:
        - sessionCookie: []
      parameters:
        - name: opponentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGameInput"
      responses:
        "201":
          description: The game started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStarted"
        "400":
          $ref: "#/components/responses/InvalidDeckOrInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GamesPaused"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The player is busy (code "busy"), as many games against the computer as allowed are
            running (code "computer_games_full"), or the opponent's deck cannot be played just now
            (code "computer_unavailable").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rematches/{gameId}:
    parameters:
      - name: gameId
        in: path
        required: true
        description: The game that ended.
        schema:
          type: string
    get:
      operationId: getRematch
      summary: The rematch of a game that just ended, for its players
      description: >-
        When a game ends with both players on the site, they are offered a rematch at once, until
        either declines, leaves the site or the offer runs out (expiresAt). Changes reach both
        players on the live connection (RealtimeRematch, RealtimeRematchEnded).
      tags: [lobby]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The rematch, as this player sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rematch"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: declineRematch
      summary: Decline the rematch, or leave it for the lobby
      description: It ends for both players, who are told on the live connection (RealtimeRematchEnded).
      tags: [lobby]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The rematch will not be played.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /rematches/{gameId}/deck:
    parameters:
      - name: gameId
        in: path
        required: true
        description: The game that ended.
        schema:
          type: string
    put:
      operationId: chooseRematchDeck
      summary: Switch to another deck for the rematch
      description: >-
        One of the player's decks, legal in the game's format. The other player agreed to the deck
        they were shown, so a different one takes back their agreement.
      tags: [lobby]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RematchDeckInput"
      responses:
        "200":
          description: The rematch, with the deck chosen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rematch"
        "400":
          $ref: "#/components/responses/InvalidDeckOrInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /rematches/{gameId}/ready:
    parameters:
      - name: gameId
        in: path
        required: true
        description: The game that ended.
        schema:
          type: string
    post:
      operationId: agreeToRematch
      summary: Offer the rematch, or accept the other player's
      description: >-
        Agrees to play the decks shown. Once both players agree, the new game starts, in the same
        format and with the same options, its coin toss called by the loser of the last game, and
        both are told on the live connection (RealtimeGameStarted) to go to it.
      tags: [lobby]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Agreed; waiting for the other player.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rematch"
        "201":
          description: Both agreed, and the new game started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStarted"
        "400":
          $ref: "#/components/responses/InvalidDeckOrInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GamesPaused"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The other player's deck no longer keeps to the format (code "opponent_deck_not_legal"):
            they must choose another, and both agree again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /games/{gameId}:
    get:
      operationId: getLiveGame
      summary: A running game, for its players and its spectators
      tags: [games]
      security:
        - sessionCookie: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The game, and how this player takes part.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveGame"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotWatchable"
        "404":
          $ref: "#/components/responses/NotFound"
  /games/{gameId}/socket:
    get:
      operationId: openGameSocket
      summary: Play or watch a game
      description: >-
        The websocket the duel board plays or watches over, in the engine's own message format.
        Only the site's own pages may open it.
      tags: [games]
      security:
        - sessionCookie: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching to the websocket.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotWatchable"
        "404":
          $ref: "#/components/responses/NotFound"
  /rankings:
    get:
      operationId: getRankings
      summary: The rankings
      description: >-
        The players who have finished a game that counted, the best rated first. Players level on
        rating share a place and are listed by name. A search keeps each player's place in the full
        rankings.
      tags: [players]
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          description: Keeps the players whose name contains it, ignoring case.
          schema:
            type: string
            maxLength: 20
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: One page of the rankings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rankings"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /players/{username}:
    parameters:
      - name: username
        in: path
        required: true
        description: The player's name, in any case.
        schema:
          type: string
    get:
      operationId: getPlayer
      summary: A player's profile
      tags: [players]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The player's rank, record and latest matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /players/{username}/matches:
    parameters:
      - name: username
        in: path
        required: true
        description: The player's name, in any case.
        schema:
          type: string
    get:
      operationId: getPlayerMatches
      summary: A player's match history
      description: Every game the player finished, counted or not, the latest first.
      tags: [players]
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of the player's matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPage"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /matches/{gameId}:
    get:
      operationId: getMatch
      summary: A finished game
      description: >-
        A game from the match history. A game is in it a moment after it ends, once saved; its two
        players are told then (match_recorded).
      tags: [players]
      security:
        - sessionCookie: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The game as it finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /formats:
    get:
      operationId: listFormats
      summary: Every format, in the order admins set
      tags: [formats]
      responses:
        "200":
          description: The formats.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Format"
  /decks:
    get:
      operationId: listDecks
      summary: The player's decks, the most recently changed first
      tags: [decks]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The decks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeckSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createDeck
      summary: Create a deck
      tags: [decks]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckInput"
      responses:
        "201":
          description: The deck was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: >-
            The player already has as many decks as allowed (code "too_many_decks"); the
            decks.max_per_player setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /starter-decks:
    get:
      operationId: listStarterDecks
      summary: The starter decks
      description: >-
        The ready-made decks every player may play without building one, the default first. Their
        ids are played as any deck's are.
      tags: [decks]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The starter decks offered.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeckSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /starter-decks/{deckId}/copy:
    post:
      operationId: copyStarterDeck
      summary: Copy a starter deck into the player's own decks
      description: The copy is the player's to change, with the starter deck's name, cover and cards.
      tags: [decks]
      security:
        - sessionCookie: []
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: The player's new deck.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The player has as many decks as allowed (code "too_many_decks").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /decks/text:
    post:
      operationId: readDeckList
      summary: Read a deck list written as text
      description: >-
        Finds the cards of a list written one card per line, as "4 Bolshack Dragon" (a line without
        a count is one copy; lines starting with # or // are skipped). Names match ignoring case,
        accents and punctuation. Saves nothing: the cards found are for a deck to be created or
        changed. Cards that cannot be played, and copies beyond 4, are left out and reported.
      tags: [decks]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckListText"
      responses:
        "200":
          description: The cards found, and the lines that could not be used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckListReading"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /decks/{deckId}:
    parameters:
      - name: deckId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDeck
      summary: One of the player's decks, with its cards and legality
      tags: [decks]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The deck.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateDeck
      summary: Replace a deck
      tags: [decks]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckInput"
      responses:
        "200":
          description: The deck as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDeck
      summary: Delete a deck
      tags: [decks]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The deck was deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /decks/{deckId}/text:
    get:
      operationId: getDeckText
      summary: A deck written as text
      description: >-
        One card per line as "4 Bolshack Dragon", by cost and then name; the format readDeckList
        reads.
      tags: [decks]
      security:
        - sessionCookie: []
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The deck list.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users:
    get:
      operationId: getAdminUsers
      summary: Search the accounts
      description: Every account, by name, with its rank, record, ban and mute.
      tags: [admin]
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          description: Keeps the accounts whose name contains it, ignoring case.
          schema:
            type: string
            maxLength: 20
        - name: status
          in: query
          description: Keeps the accounts banned now, muted now, or the admins.
          schema:
            $ref: "#/components/schemas/AdminUserStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: One page of the accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/users/{userId}/ban:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: banUser
      summary: Ban a player
      description: >-
        Replaces any earlier ban. The player's sessions end and their live connections close, the
        game they play in stops without counting, and they leave the lobby, quick match, rematches
        and the rankings while the ban lasts. They are shown the reason when they log in.
      tags: [admin]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanInput"
      responses:
        "200":
          description: The banned account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AdminConflict"
    delete:
      operationId: unbanUser
      summary: Lift a player's ban
      description: Lifting a ban that is over, or that never was, changes nothing.
      tags: [admin]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The account, no longer banned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AdminConflict"
  /admin/users/{userId}/mute:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: muteUser
      summary: Mute a player in the lobby chat
      description: >-
        Replaces any earlier mute. A muted player still reads the chat and plays.
      tags: [admin]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MuteInput"
      responses:
        "200":
          description: The muted account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AdminConflict"
    delete:
      operationId: unmuteUser
      summary: Lift a player's mute
      description: Lifting a mute that is over, or that never was, changes nothing.
      tags: [admin]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The account, no longer muted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AdminConflict"
  /admin/users/{userId}/role:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      operationId: setUserRole
      summary: Make a player an admin, or an admin a player
      description: >-
        A banned player cannot be made an admin, and the last admin cannot be made a player.
      tags: [admin]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: The account with its new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AdminConflict"
  /admin/users/{userId}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      operationId: setUserPassword
      summary: Give a player a new password
      description: >-
        For a player who has forgotten theirs: the admin passes the new password on. The player's
        sessions end, and wrong passwords tried before no longer hold them back.
      tags: [admin]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPassword"
      responses:
        "204":
          description: The password was changed.
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AdminConflict"
  /admin/computer-opponents:
    get:
      operationId: getAdminComputerOpponents
      summary: Every computer opponent, retired or not
      tags: [admin]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The opponents, in order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminComputerOpponent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createComputerOpponent
      summary: Add a computer opponent
      description: It starts retired, to be offered once its deck is ready.
      tags: [admin]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputerOpponentInput"
      responses:
        "201":
          description: The opponent as added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComputerOpponent"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ComputerOpponentNameTaken"
  /admin/computer-opponents/options:
    get:
      operationId: getComputerOpponentOptions
      summary: What a computer opponent can be set to
      tags: [admin]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The play styles and card types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputerOpponentOptions"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/computer-opponents/{opponentId}:
    parameters:
      - $ref: "#/components/parameters/OpponentId"
    get:
      operationId: getAdminComputerOpponent
      summary: A computer opponent, retired or not
      tags: [admin]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The opponent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComputerOpponent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateComputerOpponent
      summary: Change a computer opponent
      description: >-
        Games already running carry on as they started. An offered opponent's deck must keep to its
        rules (code "deck_not_legal", with every problem); retire it to work on the deck.
      tags: [admin]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputerOpponentInput"
      responses:
        "200":
          description: The opponent as changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComputerOpponent"
        "400":
          $ref: "#/components/responses/InvalidDeckOrInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ComputerOpponentNameTaken"
  /admin/computer-opponents/{opponentId}/offered:
    parameters:
      - $ref: "#/components/parameters/OpponentId"
    put:
      operationId: setComputerOpponentOffered
      summary: Offer a computer opponent to players, or retire it
      description: >-
        Once retired, running games carry on, and a rematch being decided against it ends when the
        player agrees. An opponent can be offered only if its deck keeps to its rules (code
        "deck_not_legal", with every problem).
      tags: [admin]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputerOpponentOffered"
      responses:
        "200":
          description: The opponent as changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComputerOpponent"
        "400":
          $ref: "#/components/responses/InvalidDeckOrInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/settings:
    get:
      operationId: getAdminSettings
      summary: Every server setting
      description: Each with its current value, type, limits and default, in the order declared.
      tags: [admin]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSetting"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/settings/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setAdminSetting
      summary: Change a setting
      description: It applies at once, without a restart.
      tags: [admin]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingInput"
      responses:
        "200":
          description: The setting as changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSetting"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: resetAdminSetting
      summary: Put a setting back to its default
      tags: [admin]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The setting as reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSetting"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/log:
    get:
      operationId: getAdminLog
      summary: The admin log
      description: What admins have done in the admin panel, the latest first.
      tags: [admin]
      security:
        - sessionCookie: []
      parameters:
        - name: action
          in: query
          description: Keeps the entries of one action.
          schema:
            $ref: "#/components/schemas/AdminLogAction"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: One page of the log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLogPage"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    sessionCookie:
      description: The session cookie set by sign-up and login. It is HttpOnly and SameSite=Lax.
      type: apiKey
      in: cookie
      name: session
  headers:
    SetSessionCookie:
      description: Sets the session cookie.
      schema:
        type: string
    ClearSessionCookie:
      description: Removes the session cookie.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
  parameters:
    OpponentId:
      name: opponentId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      description: The account's id.
      schema:
        type: string
  responses:
    Forbidden:
      description: Only admins can do this (code "forbidden").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ComputerOpponentNameTaken:
      description: An account already has this name (code "username_taken").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminConflict:
      description: >-
        The guards forbid it: admins cannot act on their own account (code "own_account"), an
        admin cannot be banned until made a player (code "admin_ban"), a banned player cannot be
        made an admin (code "banned_admin"), the last admin cannot be made a player (code
        "last_admin"), and a computer opponent's account cannot be changed (code
        "computer_account").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidInput:
      description: >-
        The request is not valid JSON (code "bad_request"), or a field breaks its rules (code
        "invalid_input", with the field named).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: There is no such thing (code "not_found").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Not logged in, or the session has expired (code "unauthenticated").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidDeckOrInput:
      description: >-
        A field breaks its rules (code "invalid_input", with the field named), or the player's deck
        does not keep to the format (code "deck_not_legal", with every problem).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GamesPaused:
      description: An admin has paused new games (code "games_paused").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Busy:
      description: >-
        The player is already hosting a game, waiting for a quick match or playing (code "busy").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotWatchable:
      description: >-
        The game cannot be watched: it is not listed, or does not allow spectators (code
        "not_watchable").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooFast:
      description: Doing this too often; try again after a moment (code "too_fast").
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: >-
        Too many wrong passwords for this account; try again later (code "too_many_attempts").
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          description: Whether the server can serve requests.
          $ref: "#/components/schemas/HealthStatus"
        database:
          description: Whether the database answers.
          $ref: "#/components/schemas/HealthStatus"
    HealthStatus:
      type: string
      enum: [ok, unavailable]
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          description: >-
            3 to 20 letters, numbers, underscores or hyphens, after surrounding spaces are
            trimmed. Unique regardless of case.
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^[A-Za-z0-9_-]+$"
        password:
          description: 8 to 128 characters.
          type: string
          format: password
          minLength: 8
          maxLength: 128
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          description: 8 to 128 characters.
          type: string
          format: password
          minLength: 8
          maxLength: 128
    Account:
      type: object
      required: [id, username, role, createdAt, rank]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
        rank:
          $ref: "#/components/schemas/Rank"
        mute:
          description: While an admin has muted the player in the lobby chat.
          $ref: "#/components/schemas/Penalty"
    Role:
      type: string
      enum: [player, admin]
    Penalty:
      description: A ban or a mute.
      type: object
      required: [since]
      properties:
        since:
          type: string
          format: date-time
        until:
          description: When it lifts itself; absent for one for good, which lasts until lifted.
          type: string
          format: date-time
    Ban:
      type: object
      required: [since, reason]
      properties:
        since:
          type: string
          format: date-time
        until:
          description: When it lifts itself; absent for a ban for good, which lasts until lifted.
          type: string
          format: date-time
        reason:
          description: What the player is shown when they log in.
          type: string
    AdminUser:
      description: An account as the admin panel shows it.
      type: object
      required: [id, username, role, computer, joinedAt, rank, wins, losses, online]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        computer:
          description: >-
            Whether the account is a computer opponent's, which nobody logs in to and admins
            cannot change.
          type: boolean
        joinedAt:
          type: string
          format: date-time
        rank:
          $ref: "#/components/schemas/Rank"
        wins:
          type: integer
        losses:
          type: integer
        online:
          description: Whether the player has the site open.
          type: boolean
        ban:
          description: While the player is banned.
          $ref: "#/components/schemas/Ban"
        mute:
          description: While the player is muted.
          $ref: "#/components/schemas/Penalty"
    AdminUserStatus:
      type: string
      enum: [banned, muted, admin]
    AdminUserPage:
      type: object
      required: [users, total, page, pageSize]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          description: How many accounts match, on every page.
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    BanInput:
      type: object
      required: [reason]
      properties:
        durationMinutes:
          description: How long the ban lasts, up to 365 days; absent for good.
          type: integer
          minimum: 1
          maximum: 525600
        reason:
          description: What the player is shown when they log in; one line.
          type: string
          minLength: 1
          maxLength: 200
    MuteInput:
      type: object
      properties:
        durationMinutes:
          description: How long the mute lasts, up to 365 days; absent for good.
          type: integer
          minimum: 1
          maximum: 525600
    RoleInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    NewPassword:
      type: object
      required: [password]
      properties:
        password:
          description: 8 to 128 characters.
          type: string
          format: password
          minLength: 8
          maxLength: 128
    AdminComputerOpponent:
      description: A computer opponent as the admin panel shows it.
      type: object
      required:
        - id
        - name
        - description
        - style
        - strength
        - formatId
        - formatName
        - maxCivilizations
        - cardTypes
        - offered
        - cards
        - cardCount
        - civilizations
        - problems
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        style:
          type: string
        strength:
          type: string
          enum: [easy, normal]
        formatId:
          type: string
        formatName:
          type: string
        maxCivilizations:
          description: The most civilizations its deck may have; 0 for any number.
          type: integer
        cardTypes:
          description: The card types its deck may have.
          type: array
          items:
            type: string
        offered:
          description: Players are offered it; otherwise it is retired.
          type: boolean
        cards:
          description: Its deck, by cost, then name.
          type: array
          items:
            $ref: "#/components/schemas/DeckCard"
        cardCount:
          type: integer
        civilizations:
          description: The civilizations of its deck's cards, in the game's order.
          type: array
          items:
            type: string
        problems:
          description: Every way its deck breaks its format's rules or its own; empty if it can play.
          type: array
          items:
            $ref: "#/components/schemas/DeckProblem"
    ComputerOpponentInput:
      description: A computer opponent as an admin saves it. A retired one's deck may be unfinished.
      type: object
      required: [name, description, style, strength, formatId, maxCivilizations, cardTypes, cards]
      properties:
        name:
          description: Its name, under the same rules as a player's, and not a name anyone has.
          type: string
        description:
          description: One line, up to 200 characters, shown to players choosing it.
          type: string
        style:
          description: One of the play styles.
          type: string
        strength:
          type: string
          enum: [easy, normal]
        formatId:
          type: string
        maxCivilizations:
          description: The most civilizations its deck may have; 0 for any number.
          type: integer
          minimum: 0
          maximum: 5
        cardTypes:
          description: The card types its deck may have; at least one.
          type: array
          items:
            type: string
        cards:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/DeckEntry"
    ComputerOpponentOffered:
      type: object
      required: [offered]
      properties:
        offered:
          type: boolean
    ComputerOpponentOptions:
      type: object
      required: [styles, cardTypes]
      properties:
        styles:
          description: The play styles, by label.
          type: array
          items:
            $ref: "#/components/schemas/ComputerOpponentStyle"
        cardTypes:
          description: The card types a deck's rules can allow, including those the game cannot play yet.
          type: array
          items:
            type: string
    ComputerOpponentStyle:
      type: object
      required: [name, label]
      properties:
        name:
          type: string
        label:
          type: string
    AdminSetting:
      description: A server setting as the admin panel shows it.
      type: object
      required: [key, group, description, kind, default, value, isDefault]
      properties:
        key:
          type: string
        group:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [boolean, number, text]
        default:
          type: string
        value:
          description: The current value, as text; "true" or "false" for a yes-or-no setting.
          type: string
        isDefault:
          description: No admin has set it.
          type: boolean
        min:
          description: The lowest value of a number setting.
          type: integer
          format: int64
        max:
          description: The highest value of a number setting.
          type: integer
          format: int64
        maxLength:
          description: The longest value of a text setting, in characters.
          type: integer
        updatedAt:
          description: When an admin last set it; absent while it is at its default.
          type: string
          format: date-time
    AdminSettingInput:
      type: object
      required: [value]
      properties:
        value:
          type: string
    AdminLogAction:
      type: string
      enum:
        - user_banned
        - user_unbanned
        - user_muted
        - user_unmuted
        - role_changed
        - password_reset
        - setting_changed
        - setting_reset
        - chat_message_deleted
        - game_stopped
        - computer_opponent_added
        - computer_opponent_changed
        - computer_opponent_offered
        - computer_opponent_retired
    AdminLogEntry:
      type: object
      required: [id, adminName, action, subject, details, at]
      properties:
        id:
          type: string
        adminId:
          description: The admin who acted; absent once their account is gone.
          type: string
        adminName:
          description: The admin's name as it was.
          type: string
        action:
          $ref: "#/components/schemas/AdminLogAction"
        subject:
          description: What the action was done to, such as a player's name.
          type: string
        details:
          description: How, such as a ban's length and reason; empty when there is nothing to add.
          type: string
        at:
          type: string
          format: date-time
    AdminLogPage:
      type: object
      required: [entries, total, page, pageSize]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AdminLogEntry"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    Card:
      type: object
      required: [id, name, type, cost, powerText, civilizations, races, rulesText, abilities, keywords, categories, playable, printings]
      properties:
        id:
          description: The card's id, its first printing's id in the card database.
          type: string
        name:
          type: string
        type:
          description: Such as "Creature", "Spell" or "Evolution Creature".
          type: string
        cost:
          type: integer
        power:
          description: The printed power; absent for cards without one, such as spells.
          type: integer
        powerText:
          description: The power as printed, such as "6000+"; empty without power.
          type: string
        civilizations:
          type: array
          items:
            type: string
        races:
          type: array
          items:
            type: string
        rulesText:
          type: string
        abilities:
          description: The rules text, one line per ability.
          type: array
          items:
            $ref: "#/components/schemas/CardAbility"
        keywords:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        playable:
          description: Whether the rules engine can play the card, and so whether it may go in decks.
          type: boolean
        imageUrl:
          description: The first printing's picture; absent when it has none.
          type: string
        printings:
          description: In release order.
          type: array
          items:
            $ref: "#/components/schemas/CardPrinting"
    CardAbility:
      type: object
      required: [text]
      properties:
        text:
          type: string
        reminder:
          description: The reminder text in brackets, when the line has one.
          type: string
    CardPrinting:
      type: object
      required: [id, set, collectorNumber, rarity, rarityCode]
      properties:
        id:
          type: string
        set:
          type: string
        collectorNumber:
          type: string
        rarity:
          type: string
        rarityCode:
          type: string
        imageUrl:
          description: Absent when the printing has no picture.
          type: string
    CardPage:
      type: object
      required: [cards, total, page, pageSize]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        total:
          description: How many cards match, on every page.
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    CardFilters:
      type: object
      required: [civilizations, types, races, keywords, sets]
      properties:
        civilizations:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            type: string
        races:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        sets:
          description: In release order.
          type: array
          items:
            $ref: "#/components/schemas/CardSet"
    CardSet:
      type: object
      required: [code]
      properties:
        code:
          type: string
        iconUrl:
          description: Absent when the set has no icon.
          type: string
    Format:
      type: object
      required: [id, name, description, allSets, sets, limits]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        allSets:
          description: Cards from every set are allowed, including sets added later.
          type: boolean
        sets:
          description: The allowed sets when allSets is false; empty otherwise.
          type: array
          items:
            type: string
        limits:
          description: The banned and limited cards.
          type: array
          items:
            $ref: "#/components/schemas/FormatCardLimit"
    FormatCardLimit:
      type: object
      required: [cardId, maxCopies]
      properties:
        cardId:
          type: string
        maxCopies:
          description: 0 for a banned card, 1 or 2 for a limited one.
          type: integer
          minimum: 0
          maximum: 2
    DeckInput:
      description: >-
        A deck as the player saves it. It may be unfinished, but never has more than 40 cards, more
        than 4 copies of a card, or a card the game cannot play.
      type: object
      required: [name, cards]
      properties:
        name:
          description: 1 to 40 characters, after surrounding spaces are trimmed.
          type: string
          minLength: 1
          maxLength: 40
        coverCardId:
          description: The card shown for the deck; one of its cards. Without it, the site picks one.
          type: string
        cards:
          description: Each card once, with how many copies.
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/DeckEntry"
    DeckEntry:
      type: object
      required: [cardId, count]
      properties:
        cardId:
          type: string
        count:
          type: integer
          minimum: 1
          maximum: 4
    DeckCard:
      type: object
      required: [cardId, count]
      properties:
        cardId:
          type: string
        count:
          type: integer
        card:
          description: The card; absent for a card that has left the card database.
          $ref: "#/components/schemas/Card"
    DeckCover:
      description: The card shown for a deck.
      type: object
      required: [cardId]
      properties:
        cardId:
          type: string
        imageUrl:
          type: string
    DeckSummary:
      type: object
      required: [id, name, cardCount, civilizations, legalFormatIds, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        cardCount:
          type: integer
        civilizations:
          description: The civilizations of the deck's cards, in the game's order.
          type: array
          items:
            type: string
        cover:
          description: The chosen cover card, or else the most expensive card; absent for an empty deck.
          $ref: "#/components/schemas/DeckCover"
        legalFormatIds:
          description: The formats the deck can be played in.
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
    Deck:
      type: object
      required: [id, name, cards, cardCount, civilizations, legality, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        coverCardId:
          description: The cover card the player chose; absent when the site picks one.
          type: string
        cover:
          description: The chosen cover card, or else the most expensive card; absent for an empty deck.
          $ref: "#/components/schemas/DeckCover"
        cards:
          description: By cost, then name.
          type: array
          items:
            $ref: "#/components/schemas/DeckCard"
        cardCount:
          type: integer
        civilizations:
          description: The civilizations of the deck's cards, in the game's order.
          type: array
          items:
            type: string
        legality:
          description: For every format, in the formats' order, whether the deck can be played in it.
          type: array
          items:
            $ref: "#/components/schemas/DeckLegality"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeckLegality:
      type: object
      required: [formatId, legal, problems]
      properties:
        formatId:
          type: string
        legal:
          type: boolean
        problems:
          description: Every rule the deck breaks in the format; empty for a legal deck.
          type: array
          items:
            $ref: "#/components/schemas/DeckProblem"
    DeckProblem:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/DeckProblemCode"
        message:
          description: The problem explained to the player.
          type: string
        cardId:
          description: The card at fault; absent for the deck's size.
          type: string
    DeckProblemCode:
      description: >-
        deck_size: not exactly 40 cards. not_playable: the game cannot play the card, or it has left
        the card database. not_in_format: none of its printings is from an allowed set. banned: the
        format bans it. over_limit: more copies than the format allows. too_many_copies: more than
        4 copies. too_many_civilizations and card_type: only for a computer opponent, whose deck has
        more civilizations than its rules allow, or a card of a type they do not.
      type: string
      enum:
        - deck_size
        - not_playable
        - not_in_format
        - banned
        - over_limit
        - too_many_copies
        - too_many_civilizations
        - card_type
    DeckListText:
      type: object
      required: [text]
      properties:
        text:
          description: At most 10,000 characters and 200 lines.
          type: string
          maxLength: 10000
    DeckListReading:
      type: object
      required: [cards, problems]
      properties:
        cards:
          description: The cards found, in the list's order, each once.
          type: array
          items:
            $ref: "#/components/schemas/DeckCard"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/DeckListProblem"
    DeckListProblem:
      description: A line that could not be used, or not fully.
      type: object
      required: [line, text, message]
      properties:
        line:
          description: The line's number, counting from 1.
          type: integer
        text:
          type: string
        message:
          type: string
    ChatMessage:
      type: object
      required: [id, username, text, postedAt]
      properties:
        id:
          type: string
        username:
          description: The author.
          type: string
        text:
          type: string
        postedAt:
          type: string
          format: date-time
    ChatPost:
      type: object
      required: [text]
      properties:
        text:
          description: 1 to 300 characters, after surrounding spaces are trimmed.
          type: string
          minLength: 1
          maxLength: 300
    SiteStats:
      type: object
      required: [playersOnline, gamesRunning]
      properties:
        playersOnline:
          type: integer
        gamesRunning:
          type: integer
    LobbyPerson:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
        rank:
          description: >-
            The player's rank, where the lobby and games show it; absent elsewhere, and if it could
            not be read for a live update.
          $ref: "#/components/schemas/Rank"
    PlayerActivity:
      description: >-
        What a player is doing: hosting an open game (with its id), waiting for a quick match (with
        the format's name), playing (with the game's id) or deciding on a rematch (with the id of the
        game that ended).
      type: object
      required: [kind, computer]
      properties:
        kind:
          type: string
          enum: [hosting, queued, playing, rematch]
        gameId:
          type: string
        formatName:
          type: string
        computer:
          description: The player is playing against the computer, in a game nobody else can watch.
          type: boolean
    OnlinePlayer:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
        rank:
          description: >-
            The player's rank, where the lobby and games show it; absent elsewhere, and if it could
            not be read for a live update.
          $ref: "#/components/schemas/Rank"
        activity:
          description: Absent for a player doing nothing in particular.
          $ref: "#/components/schemas/PlayerActivity"
    OpenGame:
      type: object
      required: [id, name, host, formatId, formatName, listed, spectators, createdAt]
      properties:
        id:
          description: Also the game's invite link, /play/join/{id}.
          type: string
        name:
          type: string
        host:
          $ref: "#/components/schemas/LobbyPerson"
        formatId:
          type: string
        formatName:
          type: string
        listed:
          description: Shown in the lobby; otherwise only the invite link leads to it.
          type: boolean
        spectators:
          description: Other players may watch once it runs.
          type: boolean
        createdAt:
          type: string
          format: date-time
    ComputerOpponent:
      description: A personality a player can practise against, with its own play style and deck.
      type: object
      required: [id, name, description, style, strength, formatId, formatName, civilizations]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        style:
          description: How it plays, such as "rush" or "wall".
          type: string
        strength:
          type: string
          enum: [easy, normal]
        formatId:
          description: The format its deck keeps to, and the player's deck must.
          type: string
        formatName:
          type: string
        civilizations:
          description: The civilizations of its deck, in the game's order.
          type: array
          items:
            type: string
    GamePlayer:
      type: object
      required: [id, username, deckName, computer]
      properties:
        id:
          type: string
        username:
          type: string
        deckName:
          type: string
        computer:
          description: The computer plays this seat.
          type: boolean
        rank:
          description: >-
            The player's rank, where the lobby and games show it; absent elsewhere, and if it could
            not be read for a live update.
          $ref: "#/components/schemas/Rank"
    RunningGame:
      type: object
      required: [id, name, formatId, formatName, host, guest, spectators, matchmaking, startedAt]
      properties:
        id:
          type: string
        name:
          type: string
        formatId:
          type: string
        formatName:
          type: string
        host:
          $ref: "#/components/schemas/GamePlayer"
        guest:
          $ref: "#/components/schemas/GamePlayer"
        spectators:
          description: Other players may watch it.
          type: boolean
        matchmaking:
          description: Paired by quick match.
          type: boolean
        startedAt:
          type: string
          format: date-time
    Lobby:
      type: object
      required: [openGames, runningGames, online, paused]
      properties:
        openGames:
          description: The listed open games, the oldest first.
          type: array
          items:
            $ref: "#/components/schemas/OpenGame"
        runningGames:
          description: The listed running games, the oldest first.
          type: array
          items:
            $ref: "#/components/schemas/RunningGame"
        online:
          description: The players online, by name.
          type: array
          items:
            $ref: "#/components/schemas/OnlinePlayer"
        paused:
          description: An admin has paused new games.
          type: boolean
    OpenGameInput:
      type: object
      required: [deckId, formatId, listed, spectators]
      properties:
        name:
          description: Up to 50 characters; empty or absent picks a name.
          type: string
          maxLength: 50
        deckId:
          description: One of the player's decks, or a starter deck.
          type: string
        formatId:
          type: string
        listed:
          type: boolean
        spectators:
          type: boolean
    JoinGameInput:
      type: object
      required: [deckId]
      properties:
        deckId:
          description: One of the player's decks, or a starter deck.
          type: string
    GameStarted:
      type: object
      required: [gameId]
      properties:
        gameId:
          type: string
    QuickMatchInput:
      type: object
      required: [formatId, deckId]
      properties:
        formatId:
          type: string
        deckId:
          description: One of the player's decks, or a starter deck.
          type: string
    QueueCount:
      type: object
      required: [formatId, players]
      properties:
        formatId:
          type: string
        players:
          type: integer
    QuickMatchTicket:
      description: A player's place in quick match.
      type: object
      required: [formatId, formatName, deckId, since]
      properties:
        formatId:
          type: string
        formatName:
          type: string
        deckId:
          type: string
        since:
          type: string
          format: date-time
    QuickMatchStatus:
      type: object
      required: [waiting]
      properties:
        waiting:
          description: The formats with players waiting.
          type: array
          items:
            $ref: "#/components/schemas/QueueCount"
        ticket:
          description: Present while this player waits.
          $ref: "#/components/schemas/QuickMatchTicket"
    QuickMatchEntered:
      description: Either the game, when paired at once, or the player's ticket, while waiting.
      type: object
      properties:
        gameId:
          type: string
        ticket:
          $ref: "#/components/schemas/QuickMatchTicket"
    GameRole:
      type: string
      enum: [player, spectator]
    LiveGame:
      type: object
      required: [id, name, formatName, host, guest, spectators, matchmaking, role]
      properties:
        id:
          type: string
        name:
          type: string
        formatName:
          type: string
        host:
          $ref: "#/components/schemas/GamePlayer"
        guest:
          $ref: "#/components/schemas/GamePlayer"
        spectators:
          type: boolean
        matchmaking:
          type: boolean
        role:
          description: How this player takes part.
          $ref: "#/components/schemas/GameRole"
    RealtimeMessage:
      description: >-
        A message on the live connection (GET /realtime), told apart by its type. Messages of a type
        the page does not know are ignored, so new ones can be added. Visitors receive only the chat
        and the site's numbers.
      oneOf:
        - $ref: "#/components/schemas/RealtimeChatMessage"
        - $ref: "#/components/schemas/RealtimeSiteStats"
        - $ref: "#/components/schemas/RealtimeLobby"
        - $ref: "#/components/schemas/RealtimeQuickMatchQueue"
        - $ref: "#/components/schemas/RealtimeGameStarted"
        - $ref: "#/components/schemas/RealtimeOpenGameExpired"
        - $ref: "#/components/schemas/RealtimeRematch"
        - $ref: "#/components/schemas/RealtimeRematchEnded"
        - $ref: "#/components/schemas/RealtimeMatchRecorded"
        - $ref: "#/components/schemas/RealtimeAccountChanged"
      discriminator:
        propertyName: type
        mapping:
          chat_message: "#/components/schemas/RealtimeChatMessage"
          site_stats: "#/components/schemas/RealtimeSiteStats"
          lobby: "#/components/schemas/RealtimeLobby"
          quick_match_queue: "#/components/schemas/RealtimeQuickMatchQueue"
          game_started: "#/components/schemas/RealtimeGameStarted"
          open_game_expired: "#/components/schemas/RealtimeOpenGameExpired"
          rematch: "#/components/schemas/RealtimeRematch"
          rematch_ended: "#/components/schemas/RealtimeRematchEnded"
          match_recorded: "#/components/schemas/RealtimeMatchRecorded"
          account_changed: "#/components/schemas/RealtimeAccountChanged"
    RealtimeSiteStats:
      description: How many players are online and games running, for everyone.
      type: object
      required: [type, stats]
      properties:
        type:
          type: string
          enum: [site_stats]
        stats:
          $ref: "#/components/schemas/SiteStats"
    RealtimeLobby:
      description: The lobby as it now is, for players.
      type: object
      required: [type, lobby]
      properties:
        type:
          type: string
          enum: [lobby]
        lobby:
          $ref: "#/components/schemas/Lobby"
    RealtimeQuickMatchQueue:
      description: How many players wait in each format, for players.
      type: object
      required: [type, waiting]
      properties:
        type:
          type: string
          enum: [quick_match_queue]
        waiting:
          type: array
          items:
            $ref: "#/components/schemas/QueueCount"
    RealtimeGameStarted:
      description: The player's game has started; go to it. Sent to its two players.
      type: object
      required: [type, gameId]
      properties:
        type:
          type: string
          enum: [game_started]
        gameId:
          type: string
    Rematch:
      description: A rematch being decided, as one of its players sees it.
      type: object
      required: [gameId, name, formatId, formatName, you, opponent, expiresAt]
      properties:
        gameId:
          description: The game that ended.
          type: string
        name:
          type: string
        formatId:
          type: string
        formatName:
          type: string
        you:
          $ref: "#/components/schemas/RematchSeat"
        opponent:
          $ref: "#/components/schemas/RematchSeat"
        tossCallerId:
          description: >-
            The player who calls the new game's coin toss, the loser of the last game; absent after
            a game without a winner, for either at random.
          type: string
        expiresAt:
          description: When the offer runs out.
          type: string
          format: date-time
    RematchSeat:
      type: object
      required: [id, username, deck, ready, computer]
      properties:
        id:
          type: string
        username:
          type: string
        deck:
          $ref: "#/components/schemas/RematchDeck"
        ready:
          description: The player agrees to play the decks shown.
          type: boolean
        computer:
          description: The computer plays this seat, and is always ready.
          type: boolean
    RematchDeck:
      description: A deck chosen for a rematch, shown by name and civilizations only.
      type: object
      required: [name, civilizations]
      properties:
        id:
          description: Only for the player's own deck.
          type: string
        name:
          type: string
        civilizations:
          type: array
          items:
            type: string
    RematchDeckInput:
      type: object
      required: [deckId]
      properties:
        deckId:
          description: One of the player's decks, or a starter deck.
          type: string
    RealtimeRematch:
      description: A rematch the player decides on, as it now is. Sent to its players.
      type: object
      required: [type, rematch]
      properties:
        type:
          type: string
          enum: [rematch]
        rematch:
          $ref: "#/components/schemas/Rematch"
    RealtimeRematchEnded:
      description: >-
        A rematch will not be played: a player declined, a player left the site, or the offer ran
        out. Sent to its players, who go back to the lobby.
      type: object
      required: [type, gameId, reason]
      properties:
        type:
          type: string
          enum: [rematch_ended]
        gameId:
          description: The game that ended.
          type: string
        reason:
          type: string
          enum: [declined, left, expired]
        by:
          description: The username of the player who declined or left; absent when it ran out.
          type: string
    RealtimeOpenGameExpired:
      description: Nobody joined the player's open game in time, so it closed. Sent to its host.
      type: object
      required: [type, openGame]
      properties:
        type:
          type: string
          enum: [open_game_expired]
        openGame:
          $ref: "#/components/schemas/OpenGame"
    RealtimeChatMessage:
      description: Someone posted to the lobby chat.
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          enum: [chat_message]
        message:
          $ref: "#/components/schemas/ChatMessage"
    Tier:
      type: string
      enum: [Bronze, Silver, Gold, Platinum, Diamond]
    Rank:
      description: A rating with its tier and, below Diamond, its division.
      type: object
      required: [rating, tier, label]
      properties:
        rating:
          type: integer
        tier:
          $ref: "#/components/schemas/Tier"
        division:
          description: Absent for Diamond, which has no divisions.
          type: string
          enum: [III, II, I]
        label:
          description: The rank in words, such as "Gold II" or "Diamond".
          type: string
    RankedPlayer:
      type: object
      required: [id, username, place, rank, wins, losses, streak]
      properties:
        id:
          type: string
        username:
          type: string
        place:
          description: The player's place in the full rankings, shared with any level on rating.
          type: integer
        rank:
          $ref: "#/components/schemas/Rank"
        wins:
          type: integer
        losses:
          type: integer
        streak:
          $ref: "#/components/schemas/Streak"
    Streak:
      description: The current run of wins, above zero, or of losses, below.
      type: integer
    Rankings:
      type: object
      required: [players, total, page, pageSize]
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/RankedPlayer"
        total:
          description: How many players match, on every page.
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        you:
          description: The logged-in player, wherever they are in the rankings; absent until ranked.
          $ref: "#/components/schemas/RankedPlayer"
    CivilizationPlayed:
      description: How many of a player's latest games they played a civilization in.
      type: object
      required: [civilization, games]
      properties:
        civilization:
          type: string
        games:
          type: integer
    PlayerProfile:
      type: object
      required: [id, username, joinedAt, rank, wins, losses, streak, favouriteCivilizations, recentMatches]
      properties:
        id:
          type: string
        username:
          type: string
        joinedAt:
          type: string
          format: date-time
        rank:
          $ref: "#/components/schemas/Rank"
        place:
          description: The player's place in the rankings; absent until they finish a game that counts.
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        streak:
          $ref: "#/components/schemas/Streak"
        favouriteCivilizations:
          description: >-
            The civilizations of the player's decks over their latest 50 games, the most played
            first.
          type: array
          items:
            $ref: "#/components/schemas/CivilizationPlayed"
        recentMatches:
          description: The player's latest 5 matches, the latest first.
          type: array
          items:
            $ref: "#/components/schemas/Match"
    MatchEnding:
      description: >-
        How a game ended: won by the rules of the game, by the other player surrendering or not
        coming back after losing their connection, or stopped by the server without a winner.
      type: string
      enum: [play, surrender, disconnect, aborted]
    MatchPlayer:
      type: object
      required: [id, username, deckName, civilizations, computer]
      properties:
        id:
          type: string
        username:
          type: string
        deckName:
          type: string
        computer:
          description: The computer played this seat, so the game never changed ratings.
          type: boolean
        civilizations:
          description: The civilizations of the deck as played; empty for the oldest games.
          type: array
          items:
            type: string
        ratingChange:
          description: The points the game won, above zero, or lost, below; absent if it did not count.
          type: integer
        rating:
          description: The player's rating after the game; absent if it did not count.
          type: integer
    Match:
      type: object
      required: [id, name, formatName, ending, counted, turns, durationSeconds, startedAt, endedAt, host, guest]
      properties:
        id:
          type: string
        name:
          type: string
        formatName:
          description: The format's name as it was when the game was played.
          type: string
        ending:
          $ref: "#/components/schemas/MatchEnding"
        counted:
          description: >-
            Whether the game counted for ratings: one stopped by the server, or shorter than the
            minimum length, did not.
          type: boolean
        turns:
          type: integer
        durationSeconds:
          type: integer
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        winnerId:
          description: Absent for a game without a winner.
          type: string
        host:
          $ref: "#/components/schemas/MatchPlayer"
        guest:
          $ref: "#/components/schemas/MatchPlayer"
    MatchPage:
      type: object
      required: [matches, total, page, pageSize]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        total:
          description: How many matches the player has, on every page.
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    RealtimeMatchRecorded:
      description: >-
        The player's game has been saved to the match history, with what it did to both players'
        ratings. Sent to its two players.
      type: object
      required: [type, match]
      properties:
        type:
          type: string
          enum: [match_recorded]
        match:
          $ref: "#/components/schemas/Match"
    RealtimeAccountChanged:
      description: >-
        An admin has changed the player's account, such as muting them or making them an admin, so
        their pages show it again. Sent to the player. A player put out of the site, by a ban or a
        new password, instead has their live connection closed with code 4001.
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [account_changed]
    Error:
      description: Returned with every error status.
      type: object
      required: [code, message]
      properties:
        code:
          description: A stable, machine-readable error code, such as "not_found".
          type: string
        message:
          description: A readable explanation of the error.
          type: string
        problems:
          description: Every rule the deck breaks, for "deck_not_legal" errors.
          type: array
          items:
            $ref: "#/components/schemas/DeckProblem"
        field:
          description: The request field at fault, for "invalid_input" errors.
          type: string
        until:
          description: >-
            When the ban or mute ends, for "banned" and "muted" errors; absent for one for good.
          type: string
          format: date-time
        reason:
          description: Why the player is banned, for "banned" errors.
          type: string
