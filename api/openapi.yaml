openapi: 3.0.3
info:
  title: Duel Masters Game Platform API
  version: 0.1.0
  description: >-
    The HTTP API of the Go server. The Go handler interfaces and the TypeScript client are generated
    from this file; edit it, then regenerate both.


    Requests that change something (POST, PUT, PATCH, DELETE) must be sent as JSON with
    `Content-Type: application/json`, which browsers cannot do across sites without permission;
    other content types are refused with 415. Logged-in requests carry the session cookie set by
    sign-up and login.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: /api
tags:
  - name: system
    description: The server itself.
  - name: auth
    description: Accounts, logging in and out, and passwords.
  - name: cards
    description: >-
      The card catalogue: every card in the card database, with its printings and pictures, and
      whether the rules engine can play it. Reprints are one card with several printings.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the server and its database are working
      tags: [system]
      responses:
        "200":
          description: The server and its database are working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is not answering.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/signup:
    post:
      operationId: signUp
      summary: Create an account and log it in
      description: The first account ever created becomes the admin.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The account was created and is logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "403":
          description: An admin has closed sign-ups (code "signups_closed").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The username is taken, in any case (code "username_taken").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: logIn
      summary: Log in
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          description: >-
            Wrong username or password (code "invalid_credentials"). The answer does not say which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/logout:
    post:
      operationId: logOut
      summary: Log out
      description: Ends this session. Logging out without a session is not an error.
      tags: [auth]
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearSessionCookie"
  /auth/me:
    get:
      operationId: getCurrentAccount
      summary: The account that is logged in
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The logged-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /auth/password:
    post:
      operationId: changePassword
      summary: Change the password
      description: >-
        Needs the current password. Every other session of the account ends; this one stays logged
        in.
      tags: [auth]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: The password was changed.
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The current password is wrong (code "wrong_password").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /cards:
    get:
      operationId: searchCards
      summary: Search the card catalogue
      description: >-
        Cards in name order. Every filter narrows the search; a list filter, given once per value,
        matches cards having any of its values.
      tags: [cards]
      parameters:
        - name: q
          in: query
          description: Text looked for in the name and rules text, ignoring case and accents.
          schema:
            type: string
            maxLength: 100
        - name: civilization
          in: query
          schema:
            type: array
            items:
              type: string
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
        - name: race
          in: query
          schema:
            type: array
            items:
              type: string
        - name: keyword
          in: query
          schema:
            type: array
            items:
              type: string
        - name: set
          in: query
          description: Matches cards with a printing in the set.
          schema:
            type: array
            items:
              type: string
        - name: minCost
          in: query
          schema:
            type: integer
            minimum: 0
        - name: maxCost
          in: query
          schema:
            type: integer
            minimum: 0
        - name: playable
          in: query
          description: Only cards the rules engine can play.
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 60
      responses:
        "200":
          description: One page of matching cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPage"
        "400":
          $ref: "#/components/responses/InvalidInput"
  /cards/filters:
    get:
      operationId: getCardFilters
      summary: The values the card search can filter by
      tags: [cards]
      responses:
        "200":
          description: The values, from the cards in the catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardFilters"
  /cards/{cardId}:
    get:
      operationId: getCard
      summary: One card, with every printing
      tags: [cards]
      parameters:
        - name: cardId
          in: path
          required: true
          description: The card's id, its first printing's id in the card database.
          schema:
            type: string
      responses:
        "200":
          description: The card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          $ref: "#/components/responses/NotFound"
  /cards/images/{key}:
    get:
      operationId: getCardImage
      summary: A card's picture
      description: >-
        By printing id, or by the rules engine's card id, which the duel board uses and which gives
        the card's first printing. Browsers may keep pictures for a day and check them again with
        If-Modified-Since.
      tags: [cards]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The picture.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: The browser's copy is still current.
        "404":
          $ref: "#/components/responses/NotFound"
  /cards/sets/{setCode}/icon:
    get:
      operationId: getCardSetIcon
      summary: A set's icon
      tags: [cards]
      parameters:
        - name: setCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The icon.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: The browser's copy is still current.
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      description: The session cookie set by sign-up and login. It is HttpOnly and SameSite=Lax.
      type: apiKey
      in: cookie
      name: session
  headers:
    SetSessionCookie:
      description: Sets the session cookie.
      schema:
        type: string
    ClearSessionCookie:
      description: Removes the session cookie.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
  responses:
    InvalidInput:
      description: >-
        The request is not valid JSON (code "bad_request"), or a field breaks its rules (code
        "invalid_input", with the field named).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: There is no such thing (code "not_found").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Not logged in, or the session has expired (code "unauthenticated").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: >-
        Too many wrong passwords for this account; try again later (code "too_many_attempts").
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          description: Whether the server can serve requests.
          $ref: "#/components/schemas/HealthStatus"
        database:
          description: Whether the database answers.
          $ref: "#/components/schemas/HealthStatus"
    HealthStatus:
      type: string
      enum: [ok, unavailable]
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          description: >-
            3 to 20 letters, numbers, underscores or hyphens, after surrounding spaces are
            trimmed. Unique regardless of case.
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^[A-Za-z0-9_-]+$"
        password:
          description: 8 to 128 characters.
          type: string
          format: password
          minLength: 8
          maxLength: 128
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          description: 8 to 128 characters.
          type: string
          format: password
          minLength: 8
          maxLength: 128
    Account:
      type: object
      required: [id, username, role, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
    Role:
      type: string
      enum: [player, admin]
    Card:
      type: object
      required: [id, name, type, cost, powerText, civilizations, races, rulesText, abilities, keywords, categories, playable, printings]
      properties:
        id:
          description: The card's id, its first printing's id in the card database.
          type: string
        name:
          type: string
        type:
          description: Such as "Creature", "Spell" or "Evolution Creature".
          type: string
        cost:
          type: integer
        power:
          description: The printed power; absent for cards without one, such as spells.
          type: integer
        powerText:
          description: The power as printed, such as "6000+"; empty without power.
          type: string
        civilizations:
          type: array
          items:
            type: string
        races:
          type: array
          items:
            type: string
        rulesText:
          type: string
        abilities:
          description: The rules text, one line per ability.
          type: array
          items:
            $ref: "#/components/schemas/CardAbility"
        keywords:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        playable:
          description: Whether the rules engine can play the card, and so whether it may go in decks.
          type: boolean
        imageUrl:
          description: The first printing's picture; absent when it has none.
          type: string
        printings:
          description: In release order.
          type: array
          items:
            $ref: "#/components/schemas/CardPrinting"
    CardAbility:
      type: object
      required: [text]
      properties:
        text:
          type: string
        reminder:
          description: The reminder text in brackets, when the line has one.
          type: string
    CardPrinting:
      type: object
      required: [id, set, collectorNumber, rarity, rarityCode]
      properties:
        id:
          type: string
        set:
          type: string
        collectorNumber:
          type: string
        rarity:
          type: string
        rarityCode:
          type: string
        imageUrl:
          description: Absent when the printing has no picture.
          type: string
    CardPage:
      type: object
      required: [cards, total, page, pageSize]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        total:
          description: How many cards match, on every page.
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    CardFilters:
      type: object
      required: [civilizations, types, races, keywords, sets]
      properties:
        civilizations:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            type: string
        races:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        sets:
          description: In release order.
          type: array
          items:
            $ref: "#/components/schemas/CardSet"
    CardSet:
      type: object
      required: [code]
      properties:
        code:
          type: string
        iconUrl:
          description: Absent when the set has no icon.
          type: string
    Error:
      description: Returned with every error status.
      type: object
      required: [code, message]
      properties:
        code:
          description: A stable, machine-readable error code, such as "not_found".
          type: string
        message:
          description: A readable explanation of the error.
          type: string
        field:
          description: The request field at fault, for "invalid_input" errors.
          type: string
