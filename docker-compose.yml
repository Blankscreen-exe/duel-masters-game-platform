# Duel Masters Game Platform with Docker Compose: the whole site on one
# server. Settings come from .env next to this file (copy .env.example; at the
# least set DOMAIN and APP_SECRET_KEY).
#
#   docker compose up -d --build                      # with SQLite on the data volume
#   docker compose --profile postgres up -d --build   # with PostgreSQL (set DB_DRIVER and
#                                                     # POSTGRES_URL in .env, see .env.example)
#
# Caddy (deploy/Caddyfile) is the only container reachable from outside, on
# ports 80 and 443. It serves the site over HTTPS for DOMAIN and passes /api to
# the Go server and everything else to the website.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Certificates are fetched over ports 80 and 443, so both must be reachable
    # from the internet for a real domain. 443/udp is HTTP/3.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and their keys: keep them across restarts, or Caddy
      # asks for new ones every time and runs into the issuer's limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: duel-masters-server:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # The addresses players open the site from: the domain, unless set; see .env.example.
      SITE_ORIGINS: ${SITE_ORIGINS:-https://${DOMAIN:-localhost}}
      # Encrypts the mail server's settings in the database; see .env.example.
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env; make one with openssl rand -base64 32}
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: duel-masters-web:latest
    restart: unless-stopped
    environment:
      # Pages rendered on the server call the Go server here, inside the compose network.
      GO_SERVER_URL: http://server:8080
    depends_on:
      server:
        condition: service_healthy

  postgres:
    profiles: [postgres]
    image: postgres:16-alpine
    restart: unless-stopped
    # The same credentials as POSTGRES_URL in .env. PostgreSQL refuses to start
    # without a password.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  data:
  postgres-data:
  caddy-data:
  caddy-config:
