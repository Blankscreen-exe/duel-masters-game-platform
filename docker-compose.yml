# Duel Masters Game Platform with Docker Compose. Settings come from .env next
# to this file (copy .env.example).
#
#   docker compose up -d --build                      # server with SQLite on the data volume
#   docker compose --profile postgres up -d --build   # server with PostgreSQL (set DB_DRIVER and
#                                                     # POSTGRES_URL in .env, see .env.example)

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: duel-masters-server:latest
    restart: unless-stopped
    # Published on this machine only: put a tunnel or reverse proxy in front
    # for internet access. Set SERVER_PORT in .env to use another port.
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # The addresses players open the site from; see .env.example.
      SITE_ORIGINS: ${SITE_ORIGINS:-http://localhost:3000}
      # Encrypts the mail server's settings in the database; see .env.example.
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env; make one with openssl rand -base64 32}
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    profiles: [postgres]
    image: postgres:16-alpine
    restart: unless-stopped
    # The same credentials as POSTGRES_URL in .env. PostgreSQL refuses to start
    # without a password.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  data:
  postgres-data:
