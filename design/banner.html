  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #000; }

  #banner {
    position: relative;
    flex: none;
    width: 1280px;
    height: 320px;
    overflow: hidden;
    font-family: Rajdhani, ui-sans-serif, system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(ellipse 620px 340px at 960px 170px, rgba(56, 189, 248, 0.24), transparent 70%),
      radial-gradient(ellipse 520px 300px at 120px 40px, #1a2233, transparent 75%),
      #07090e;
  }

  /* The grid of the site's pages. */
  #banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* The five civilizations along the bottom edge. */
  .civs { position: absolute; inset: auto 0 0; z-index: 5; display: flex; height: 6px; }
  .civs i { flex: 1; }

  .words { position: absolute; left: 64px; top: 50%; transform: translateY(-50%); width: 620px; }
  .kicker { font-size: 21px; font-weight: 600; letter-spacing: 0.34em; text-transform: uppercase; color: #38bdf8; }
  h1 {
    margin-top: 2px;
    font-size: 84px;
    font-weight: 700;
    line-height: 0.98;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    white-space: nowrap;
    background: linear-gradient(180deg, #fff 15%, #cbd5e1 55%, #64748b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.8));
  }
  .line { margin-top: 14px; font-size: 25px; font-weight: 600; letter-spacing: 0.02em; color: #cbd5e1; }
  .tags { display: flex; gap: 10px; margin-top: 18px; }
  .tags span {
    padding: 6px 14px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #e2e8f0;
    background: rgba(15, 20, 29, 0.9);
    box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.4);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }

  .fan { position: absolute; left: 982px; top: 160px; }
  .card {
    position: absolute;
    width: 156px;
    left: -78px;
    top: -108px;
    filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.75));
  }
  .card-0 { transform: translate(-194px, 40px) rotate(-18deg); }
  .card-1 { transform: translate(-100px, 11px) rotate(-9deg); }
  .card-2 { transform: translate(0, 0); z-index: 3; }
  .card-3 { transform: translate(100px, 11px) rotate(9deg); z-index: 2; }
  .card-4 { transform: translate(194px, 40px) rotate(18deg); z-index: 1; }
  .card-0 { z-index: 1; }
  .card-1 { z-index: 2; }
</style>
