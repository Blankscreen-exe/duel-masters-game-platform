name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (format, generated code, vet, test, race)
    runs-on: ubuntu-latest
    services:
      # A real PostgreSQL, so every data-layer test runs on it as well as on
      # SQLite. The tests require it on CI rather than skipping.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgres://test:test@localhost:5432/platform_test?sslmode=disable
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
        with:
          # The card database, which the catalogue tests read.
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Generated code is up to date
        run: |
          go generate ./...
          changes="$(git status --porcelain -- .)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- .
            echo "Generated code differs from the contract: run go generate ./... in apps/server and commit the result."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 300s

      - name: Race
        run: go test -race ./... -count=1 -timeout 300s

  docker:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The card database, which the image includes.
          submodules: true

      - name: Build
        run: docker build -f apps/server/Dockerfile -t duel-masters-server:ci .

  packages:
    name: Packages (type-check, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check and test
        run: pnpm -r test
